<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PresentKo</title>
    <style>
        :root {
            --olive: 212, 222, 123;
            --maroon: 110, 30, 30;
            --hover: 140, 40, 40;
            --glass: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.55);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20px;   
            z-index: -1;
            background-image:
                linear-gradient(135deg, rgba(var(--olive), 0.55), rgba(var(--maroon), 0.65)),
                url('../static/bg2.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
        }

        .page-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 560px;
            animation: rise 0.6s ease-out both;
        }

        .welcome-text {
            margin: 0;
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .welcome-sub {
            margin: -16px 0 0;
            font-size: 1rem;
            opacity: 0.9;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        }

        .cards-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 20px;
            min-height: 320px;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: inherit;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover,
        .card:focus-visible {
            background-color: rgba(var(--hover), 0.75);
            transform: translateY(-6px);
            /* ring via box-shadow so the layout doesn't shift like a thicker border would */
            box-shadow: 0 0 0 3px #fff, 0 18px 36px rgba(0, 0, 0, 0.35);
            outline: none;
        }

        .card:active { transform: translateY(-2px); }

        .icon {
            width: 84px;
            height: 84px;
            margin-top: 20px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .icon svg {
            width: 44px;
            height: 44px;
            stroke: #fff;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h2 {
            margin: 6px 0 0;
            font-size: 1.5rem;
        }

        .card p {
            margin: 0;
            max-width: 18ch;
            font-size: 0.95rem;
            line-height: 1.4;
            opacity: 0.9;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        @media (max-width: 520px) {
            .cards-row { grid-template-columns: 1fr; }
            .card { min-height: 0; padding: 24px 20px; }
            .icon { margin-top: 0; width: 72px; height: 72px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-container { animation: none; }
            .card { transition: none; }
            .card:hover, .card:focus-visible { transform: none; }
        }
    </style>
</head>
<body>

    <main class="page-container">
        <h1 class="welcome-text">Welcome, Ga!</h1>
        <p class="welcome-sub">Choose how you want to continue.</p>

        <!-- Real links: keyboard accessible, open in a new tab, no JavaScript needed -->
        <nav class="cards-row" aria-label="Choose your role">
            <a class="card" id="student" href="{{ url_for('student_page') }}">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 9 12 4 2 9l10 5 10-5Z"/>
                        <path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/>
                        <path d="M22 9v6"/>
                    </svg>
                </span>
                <h2>Student</h2>
                <p>Check your attendance and classes.</p>
            </a>

            <a class="card" id="teacher_card" href="{{ url_for('login') }}">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="12" rx="1.5"/>
                        <path d="M12 16v4M8 20h8"/>
                        <path d="m7 12 3-3 2.5 2.5L17 7"/>
                    </svg>
                </span>
                <h2>Teacher</h2>
                <p>Log in to manage your classes.</p>
            </a>
        </nav>
    </main>

</body>
</html>
